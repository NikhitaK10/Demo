on: 
  push:
    branches:
      - feature/demo_feature

jobs:
  job_sync:
    runs-on: [self-hosted, Windows]
    env:
       Win_Topaz_Location: ${{ vars.TOPAZ_LOCATION }}
    name: Code Pipeline Sync on self-hosted runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize
        uses: bmc-compuware/ispw-sync-local@v2.0
        id: sync-local
        with:
          host: 'cw09.bmc.com'
          port: 47624
          uid: 'PINNXK0'
          pass: ${{ secrets.ISPW_PWD }}
          runtimeConfiguration: 'TPTP'
          stream: 'TOPAZ'
          application: 'ISP2'
          subAppl: 'ISP2'
          checkoutLevel: 'DEV1'
          gitUid: 'NikhitaK10'
          gitToken: ${{ secrets.GITHUB_TOKEN}}
          winTopazPath: "C:/WorkbenchCLI"
          ispwConfigPath: "GenApp_MainframeCore/ispwconfig.yml"
          assignmentPrefix: "ISP2"
          showEnv: true
